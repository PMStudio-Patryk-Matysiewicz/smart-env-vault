[package]
name = "smart-env-vault"
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"

[dependencies]
age = "0.12"
dirs = "7"
keyring = "4"
secrecy = "0.10"
zeroize = "1"
getrandom = "0.4"
thiserror = "2"
rusqlite = { version = "0.43", features = ["bundled"] }
aes-gcm = { version = "0.11", features = ["zeroize"] }
uuid = { version = "1", features = ["v4", "v7"] }
hkdf = "0.13"
sha2 = "0.11.1"
ed25519-dalek = "3"
bech32 = "0.12"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils = "0.2"
