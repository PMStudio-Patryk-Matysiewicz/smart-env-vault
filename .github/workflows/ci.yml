name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Shells for hook tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish dash

      - name: Shells for hook tests (macOS)
        if: runner.os == 'macOS'
        # zsh, dash and bash 3.2 (/bin/bash) come with macOS.
        run: brew install fish

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
        env:
          # macOS: test the system bash 3.2, not a newer one from Homebrew.
          SMART_ENV_TEST_BASH: ${{ runner.os == 'macOS' && '/bin/bash' || '' }}
