[package]
name = "smart-env-cli"
version = "0.1.0"
edition = "2024"

[lib]
name = "smart_env_cli"
path = "src/lib.rs"

[[bin]]
name = "smart-env"
path = "src/main.rs"

[dependencies]
smart-env-vault = { path = "../smart-env-vault" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25"
whoami = "2"
secrecy = "0.10"
zeroize = "1"
rpassword = "7"

[dev-dependencies]
secrecy = "0.10"
tempfile = "3"
